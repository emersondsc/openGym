name: Test & Deploy to VPS

on:
  push:
    branches:
      - emerson-custom
  pull_request:
    branches:
      - emerson-custom
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test-frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  test-api:
    name: API Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: node --test

  test-scripts:
    name: Local Scripts Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run scripts tests
        run: node --test "scripts/*.test.mjs"

  deploy:
    name: Deploy to vps_oracle
    needs: [test-frontend, test-api]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull & rebuild on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -euo pipefail
          cd /mnt/drivebackup/apps/openGym/openGym
          git fetch origin emerson-custom

          CURRENT_BRANCH="$(git symbolic-ref --short HEAD 2>/dev/null || true)"
          if [ "$CURRENT_BRANCH" != "emerson-custom" ]; then
            echo "Aborting deploy: VPS branch is '$CURRENT_BRANCH' instead of 'emerson-custom'"
            git status -sb
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "Aborting deploy: VPS working tree is dirty"
            git status --porcelain
            exit 1
          fi

          AHEAD="$(git rev-list origin/emerson-custom..HEAD)"
          if [ -n "$AHEAD" ]; then
            echo "Aborting deploy: VPS has local commits ahead of origin/emerson-custom"
            git log --oneline origin/emerson-custom..HEAD
            exit 1
          fi

          git pull --ff-only origin emerson-custom
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/api/health; then
              echo ""
              echo "Deploy verified."
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck failed after 60s"
          docker compose logs --tail=50
          exit 1
          EOF
