name: opengym

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC).
  media:
    image: alpine/git
    volumes:
      - /mnt/drivebackup/apps/openGym/media/img:/out/img
      - /mnt/drivebackup/apps/openGym/media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework).
  # image: prebuilt (docker compose pull). build: from source (docker compose up --build).
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    build:
      context: .                    # a raiz: o Dockerfile precisa ver frontend/src/lib/ também
      dockerfile: api/Dockerfile
    restart: unless-stopped
    healthcheck:
      # /api/health e rota real da API (api/server.js:384) e responde 200 com {"ok":true}
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
    volumes:
      - /mnt/drivebackup/apps/openGym/data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  # No fork arvids-unavailable/openGym o Dockerfile do web esta na RAIZ (nao em web/).
  web:
    image: opengym-web:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    healthcheck:
      # o nginx do web escuta em 8081 (e 9000 ssl), NAO na 80 — sondar a 80 daria
      # "connection refused" e o container ficaria unhealthy para sempre
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "${WEB_PORT:-8080}:9000"
      - "8081:8081"
    volumes:
      - /mnt/drivebackup/apps/openGym/media/img:/usr/share/nginx/html/img:ro
      - /mnt/drivebackup/apps/openGym/media/gif:/usr/share/nginx/html/gif:ro
      - /mnt/drivebackup/apps/openGym/openGym/og.crt:/etc/nginx/ssl/og.crt:ro
      - /mnt/drivebackup/apps/openGym/openGym/og.key:/etc/nginx/ssl/og.key:ro
